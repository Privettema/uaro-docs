# Build hooks
hooks:
  - hooks/all_pages.py
  - hooks/patch_notes.py
  - hooks/toc.py

# Markdown extensions
markdown_extensions:
  # Table of contents with anchor links
  - toc:
      permalink: true
      permalink_title: "Anchor link to this section"
      toc_depth: 2

  # Abbreviations
  - abbr

  # Admonitions (callout boxes like "note", "warning")
  - admonition

  # Custom HTML attributes and CSS for elements
  - attr_list

  # Definition lists (description lists)
  - def_list

  # Footnotes
  - footnotes

  # Markdown inside HTML
  - md_in_html

  # Tables in Markdown
  - tables

  # Task lists with checkboxes (for to-do lists)
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false

  # Advanced fenced code blocks
  - pymdownx.superfences

  # Syntax highlighting for code blocks
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true

  # Inline code highlighting
  - pymdownx.inlinehilite

  # Better emphasis for bold and italic
  - pymdownx.betterem

  # Highlighting for caret (^), mark (~), and tilde
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde

  # Collapsible sections
  - pymdownx.details

  # Emoji support
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # Support for content tabs
  - pymdownx.tabbed:
      alternate_style: true

# Plugins
plugins:
  - search  # Built-in search functionality for MkDocs
  - redirects:
      redirect_maps:
        # Pages moved out of patch-notes/. Keep old links working.
        patch-notes/2025/Christmas_2025_Event_Guide.md: christmas-event-2025.md
        patch-notes/2025/halloween2025.md: halloween-event-2025.md
        patch-notes/2025/Halloween_2025_Event_Guide.md: halloween-event-2025.md
        # Renamed to a consistent lowercase-hyphenated style. Keep old links working.
        # A handful of old names that differed from the new one only by letter case
        # (Battlegrounds.md -> battlegrounds.md, FAQ.md -> faq.md, etc.) are deliberately not
        # listed here: on a case-insensitive filesystem (macOS, Windows) that redirect and the
        # real page resolve to the same path, and the stub silently overwrites the real page.
        # Case-sensitive hosts don't need the redirect for these, since almost nothing links to
        # a page by a different letter case than the one it was written with.
        All_Patch_Notes.md: all-patch-notes.md
        Attendance_System.md: attendance-system.md
