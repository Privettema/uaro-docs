# Site metadata
site_name: uaRO Documentation
site_description: The official documentation for uaRO World of your Dream
site_author: uaRO Team
site_url: https://wiki.uaro.net

# Report links to missing pages and anchors as warnings
validation:
  anchors: warn

# Theme configuration
theme:
  custom_dir: overrides
  logo: img/logo-horizontal.webp
  favicon: img/favicon.ico
  name: material
  features:
    - navigation.top
    - navigation.sections
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.indexes
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs
    - content.code.annotate
    - content.code.copy
  language: en
  font:
    text: Inter
  palette:
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
      primary: custom
      accent: custom
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
      primary: custom
      accent: custom

